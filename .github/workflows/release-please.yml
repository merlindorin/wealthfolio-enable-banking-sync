# Opens (and keeps up to date) a release PR from the conventional commits on main.
# Merging that PR bumps package.json and manifest.json, updates CHANGELOG.md, tags
# vX.Y.Z and creates the GitHub release; the second job then builds the addon and
# attaches the zip and its checksum to that release.
#
# A PR opened by the default token does not run CI on its own, or waits for a
# manual approval. So after each update of the release PR this workflow starts CI
# on its branch itself: workflow_dispatch is the one trigger the default token may
# use without approval, and the checks show up on the PR. Adding a personal access
# token as the RELEASE_PLEASE_TOKEN secret makes this unnecessary.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: run CI on the release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  assets:
    name: build and attach the zip
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm bundle
      - name: checksum
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.zip dist/SHA256SUMS --clobber
