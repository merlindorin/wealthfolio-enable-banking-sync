# Cuts a GitHub release when a v* tag is pushed. `task release -- <bump>` creates the tag.
#
# The tag must match the version in package.json and manifest.json, and the
# release notes are the matching section of CHANGELOG.md, so a release cannot be
# published with a stale version or without notes.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: pnpm check
      - run: pnpm bundle
      - name: checksum
        working-directory: dist
        run: sha256sum ./*.zip > SHA256SUMS
      - name: release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
