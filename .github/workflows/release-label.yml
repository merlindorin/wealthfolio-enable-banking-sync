# Adding the `release` label to the release-please PR merges it and publishes the release.
#
# A merge made with the default Actions token does not trigger other workflows, so
# this one starts release-please by hand afterwards; workflow_dispatch is the one
# event the default token is allowed to trigger.
name: release-label

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  publish:
    name: merge and release
    if: >-
      github.event.label.name == 'release' &&
      startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: merge the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
      - name: start release-please
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-please.yml --repo "$GITHUB_REPOSITORY" --ref main
