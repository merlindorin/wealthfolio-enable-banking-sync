version: '3'

tasks:
  # ---------------------------------------------------------------- code ----

  install:
    desc: Install the dependencies
    cmd: pnpm install --frozen-lockfile

  check:
    desc: Everything CI runs — typecheck, lint, format, tests with coverage, build
    cmd: pnpm check

  test:
    desc: Run the test suite
    cmd: pnpm test

  test:coverage:
    desc: Run the test suite and enforce the coverage thresholds
    cmd: pnpm test:coverage

  lint:
    desc: Lint the sources
    cmd: pnpm lint

  format:
    desc: Format the sources with Prettier
    cmd: pnpm format

  build:
    desc: Build the addon into ./dist
    cmd: pnpm build

  bundle:
    desc: Build the installable zip into ./dist
    cmd: pnpm bundle

  demo:
    desc: Run the addon against fictional data on http://localhost:5199
    cmd: pnpm demo

  # ------------------------------------------------------------- release ----

  release:
    desc: 'Cut a release: task release -- patch|minor|major|x.y.z'
    cmd: pnpm release {{.CLI_ARGS}}

  release:notes:
    desc: 'Print the changelog notes of a version: task release:notes -- 1.2.0'
    cmd: node scripts/release-notes.mjs {{.CLI_ARGS}}
